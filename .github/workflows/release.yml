name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_macos:
        type: boolean
        default: false
        description: 'Build, sign, notarize, and upload macOS desktop artifacts for the current version'

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm release:version
          publish: pnpm release
          title: Release Interlock
          commit: Version Interlock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    needs: release
    if: github.ref == 'refs/heads/main' && (needs.release.outputs.published == 'true' || inputs.build_macos == true)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Apple Developer ID G2 intermediate certificate
        run: |
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/DeveloperIDG2CA.cer
          security import /tmp/DeveloperIDG2CA.cer -k ~/Library/Keychains/login.keychain-db -A || true
          rm -f /tmp/DeveloperIDG2CA.cer
      - name: Build, sign, and notarize macOS desktop app
        run: pnpm --filter @interlock/desktop dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS release artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="@type_of/interlock@${VERSION}"
          gh release upload "$TAG" \
            packages/desktop/release/*.dmg \
            packages/desktop/release/*.zip \
            packages/desktop/release/*.blockmap \
            packages/desktop/release/latest-mac.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
